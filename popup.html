<!doctype html>
<html>
    <head>
        <link rel="stylesheet" href="popup.css" />
    </head>
    <body>
        <h3>Active Groups</h3>
        <div id="groupList" style="margin-bottom: 20px"></div>

        <h3>Custom Rules</h3>
        <label for="regexInput">Regex Pattern:</label>
        <input type="text" id="regexInput" placeholder="e.g., .*google.*" />

        <label for="nameInput">Group Name:</label>
        <input type="text" id="nameInput" placeholder="e.g., Google Sites" />

        <button id="addRule">Add Rule</button>

        <div class="rule-list" id="ruleList"></div>

        <script src="popup.js"></script>
    </body>
</html>
